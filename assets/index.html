<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fakturace</title>
<style>
@font-face { font-family: "Lato"; src: url("/fonts/Lato-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Lato"; src: url("/fonts/Lato-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Lato"; src: url("/fonts/Lato-Light.ttf") format("truetype"); font-weight: 300; font-display: swap; }

:root {
  --bg: #eceff4; --surface: #ffffff; --sunken: #f4f6f9; --ink: #14181f; --muted: #5a6472; --line: #d5dae3;
  --accent: #2b59d9; --accent-ink: #ffffff; --accent-soft: #e3eafc;
  --ok: #17794a; --warn: #9a5b00; --warn-soft: #fff3d6; --bad: #b3261e; --bad-soft: #fde7e5;
  --rail: #14181f; --rail-ink: #e9ecf2; --rail-muted: #8d97a8;
  --shadow: 0 1px 2px rgba(20,24,31,.06), 0 8px 24px -12px rgba(20,24,31,.18);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #10141c; --surface: #19202c; --sunken: #141a24; --ink: #e8ebf1; --muted: #98a2b3; --line: #2c3545;
  --accent: #8aa6ff; --accent-ink: #0d1322; --accent-soft: #212c48;
  --ok: #5dd39e; --warn: #f2c063; --warn-soft: #3a2f14; --bad: #ff8a80; --bad-soft: #40201e;
  --rail: #0b0e14; --rail-ink: #e8ebf1; --rail-muted: #7d8798;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 15px/1.45 "Lato", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1 { font-size: 26px; font-weight: 300; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
.app { display: grid; grid-template-columns: 212px 1fr; min-height: 100%; }

/* postranní lišta */
.rail { background: var(--rail); color: var(--rail-ink); padding: 22px 14px 16px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { font-weight: 700; font-size: 19px; padding: 0 10px 2px; letter-spacing: .01em; }
.brand-sub { color: var(--rail-muted); font-size: 12.5px; padding: 0 10px 18px; }
.rail a { color: var(--rail-ink); text-decoration: none; padding: 9px 10px; border-radius: 6px; display: block; }
.rail a:hover { background: rgba(255,255,255,.07); }
.rail a.on { background: #fff; color: #14181f; font-weight: 700; }
.rail a.new { background: #3d6df2; color: #fff; font-weight: 700; margin: 4px 0 14px; text-align: center; }
.rail a.new:hover { background: #5580f5; }
.rail .spacer { flex: 1; }
.rail .foot { color: var(--rail-muted); font-size: 12.5px; padding: 0 10px; }
.rail button.theme { background: none; border: 1px solid rgba(255,255,255,.18); color: var(--rail-ink); border-radius: 6px; padding: 7px 10px; cursor: pointer; margin: 8px 0 10px; text-align: left; }
.rail button.theme:hover { background: rgba(255,255,255,.07); }

.main { padding: 28px 34px 60px; min-width: 0; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.head p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-block; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.small { padding: 4px 9px; font-size: 13.5px; }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); padding-left: 6px; padding-right: 6px; }
.btn.danger { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 16px; }
.panel > p.hint, .hint { color: var(--muted); font-size: 13.5px; margin: -6px 0 14px; max-width: 70ch; }

/* formuláře */
.grid { display: grid; gap: 12px 14px; grid-template-columns: repeat(12, 1fr); }
.f { grid-column: span 6; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f.s2 { grid-column: span 2; } .f.s3 { grid-column: span 3; } .f.s4 { grid-column: span 4; } .f.s8 { grid-column: span 8; } .f.s12 { grid-column: span 12; }
.f > span { font-size: 13px; color: var(--muted); }
input[type=text], input[type=date], input[type=number], input[type=email], select, textarea {
  background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.check { display: flex; gap: 8px; align-items: flex-start; grid-column: span 12; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--accent); }
.check small { display: block; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sunken); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 14px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: var(--surface); font-weight: 700; }

/* kniha dokladů */
.stats { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 16px; box-shadow: var(--shadow); }
.stats div { padding: 14px 22px; border-right: 1px solid var(--line); flex: 1 1 150px; }
.stats div:last-child { border-right: 0; }
.stats b { display: block; font-size: 22px; font-weight: 300; white-space: nowrap; }
.stats span { color: var(--muted); font-size: 13px; }
.stats .late b { color: var(--bad); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filters select, .filters input { width: auto; background: var(--surface); }
.filters input[type=text] { flex: 1 1 220px; max-width: 340px; }
.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; box-shadow: var(--shadow); }
table.ledger { width: 100%; border-collapse: collapse; }
.ledger th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 400; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ledger td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ledger tr:last-child td { border-bottom: 0; }
.ledger tbody tr:hover { background: var(--sunken); }
.ledger .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ledger .no { font-weight: 700; white-space: nowrap; }
.ledger .no a { color: var(--ink); text-decoration: none; }
.ledger .no a:hover { color: var(--accent); text-decoration: underline; }
.ledger tr.void td { color: var(--muted); }
.ledger tr.void .no a, .ledger tr.void .amount { text-decoration: line-through; color: var(--muted); }
.ledger .rowact { white-space: nowrap; text-align: right; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-right: 8px; background: var(--accent-soft); color: var(--accent); min-width: 28px; text-align: center; }
.tag.zalohova { background: var(--warn-soft); color: var(--warn); }
.tag.paragon { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.tag.ddpp { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); }
.state { white-space: nowrap; font-size: 13.5px; }
.state::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: var(--muted); }
.state.paid { color: var(--ok); } .state.paid::before { background: var(--ok); }
.state.late { color: var(--bad); font-weight: 700; } .state.late::before { background: var(--bad); }
.state.open::before { background: var(--warn); }
.empty { padding: 44px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }

details.more { display: inline-block; position: relative; }
details.more summary { list-style: none; cursor: pointer; }
details.more summary::-webkit-details-marker { display: none; }
details.more .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 230px; padding: 5px; text-align: left; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.menu button:hover { background: var(--sunken); }
.menu button.danger { color: var(--bad); }

/* editor */
.editor { display: grid; grid-template-columns: minmax(420px, 640px) minmax(360px, 1fr); gap: 20px; align-items: start; }
.preview { position: sticky; top: 16px; }
.preview iframe { width: 100%; height: calc(100vh - 150px); min-height: 520px; border: 1px solid var(--line); border-radius: 10px; background: #fff; display: block; }
.pages { display: grid; gap: 10px; max-height: calc(100vh - 150px); overflow-y: auto; }
.pages img, .tpl .shot img { width: 100%; display: block; background: #fff; }
.pages img { border: 1px solid var(--line); border-radius: 6px; }
.tpl .shot img { position: absolute; inset: 0; height: 100%; object-fit: cover; object-position: top; }
.preview .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
table.items { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
.items th { font-size: 12.5px; color: var(--muted); font-weight: 400; text-align: left; padding: 0 4px 5px; }
.items td { padding: 3px 4px; vertical-align: top; }
.items td:first-child, .items th:first-child { padding-left: 0; }
.items .q { width: 68px; } .items .u { width: 62px; } .items .p { width: 108px; } .items .v { width: 80px; } .items .x { width: 30px; }
.items input, .items select { padding: 7px 8px; }
.items textarea { min-height: 37px; height: 37px; padding: 7px 8px; }
.items .num input { text-align: right; }
.items button.rm { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 8px 4px; }
.items button.rm:hover { color: var(--bad); }
.totals { margin: 18px 0 0 auto; max-width: 330px; }
.totals div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); }
.totals div b { color: var(--ink); font-weight: 400; font-variant-numeric: tabular-nums; }
.totals div.final { border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 8px; color: var(--ink); font-weight: 700; align-items: baseline; }
.totals div.final b { font-size: 24px; font-weight: 300; }
.notice { border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; font-size: 14px; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.info { background: var(--accent-soft); color: var(--ink); }
.notice ul { margin: 0; padding-left: 18px; }

/* šablony */
.tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.tpl { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: block; }
.tpl.on { border-color: var(--accent); }
.tpl .shot { aspect-ratio: 210/297; background: #fff; position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.tpl .shot iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.tpl .cap { padding: 12px 14px 14px; }
.tpl .cap b { display: block; margin-bottom: 3px; }
.tpl .cap span { color: var(--muted); font-size: 13.5px; }
.tpl.on .cap b::after { content: " – výchozí"; color: var(--accent); font-weight: 400; }
.swatches { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.swatches button.on { box-shadow: 0 0 0 2px var(--ink); }
.swatches input[type=color] { width: 40px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }

.imgbox { display: flex; gap: 14px; align-items: center; }
.imgbox > div:last-child { min-width: 0; }
.imgbox .thumb { flex: none; }
.imgbox .thumb { width: 190px; height: 70px; border: 1px dashed var(--line); border-radius: 8px; display: grid; place-items: center; background: #fff; color: #6b7480; font-size: 13px; overflow: hidden; }
.imgbox img { max-width: 100%; max-height: 100%; }
.series { display: grid; grid-template-columns: 1.3fr 1.2fr .7fr 1fr; gap: 8px 12px; align-items: center; }
.series .h { font-size: 13px; color: var(--muted); }
.series code { font: inherit; font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 8px; box-shadow: var(--shadow); z-index: 100; max-width: min(92vw, 640px); }
.toast.bad { background: var(--bad); color: #fff; }
:root[data-theme="dark"] .toast.bad { color: #1b0c0b; }

@media (max-width: 1100px) { .editor { grid-template-columns: 1fr; } .preview { position: static; } .preview iframe { height: 80vh; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px; }
  .brand-sub, .rail .spacer, .rail .foot { display: none; }
  .rail .new { margin: 0; } .rail button.theme { margin: 0 0 0 auto; }
  .main { padding: 18px 14px 50px; }
  .grid > .f { grid-column: span 12 !important; }
  .items textarea { min-height: 58px; }
  .series { grid-template-columns: 1fr 1fr; }
  .head .actions { width: 100%; }
  .panel { padding: 16px 14px; }
  .items thead { display: none; }
  .items tr { display: grid; grid-template-columns: 1fr 1fr 1.4fr 1fr 30px; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .items td { padding: 0; width: auto !important; }
  .items td:first-child { grid-column: 1 / -1; }
  .ledger th, .ledger td { padding: 9px 8px; }
  .ledger .rowact .btn { margin-bottom: 4px; }
  .pages { max-height: none; }
  details.more .menu { right: 0; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .rail a { transition: background .12s, border-color .12s, filter .12s; } }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Hlavní navigace">
    <div class="brand">Fakturace</div>
    <div class="brand-sub" id="brandSub"></div>
    <a class="new" href="#/novy">Nový doklad</a>
    <a href="#/doklady" data-nav="doklady">Kniha dokladů</a>
    <a href="#/adresar" data-nav="adresar">Adresář</a>
    <a href="#/sablony" data-nav="sablony">Šablony</a>
    <a href="#/nastaveni" data-nav="nastaveni">Nastavení</a>
    <div class="spacer"></div>
    <button class="theme" id="themeBtn" type="button"></button>
    <div class="foot" id="railFoot"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<script>
"use strict";
let S = null;            // stav ze serveru
let draft = null;        // rozpracovaný doklad
let F = { year: "", kind: "", state: "", q: "" };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = h => new Intl.NumberFormat("cs-CZ", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format((h || 0) / 100) + " Kč";
const czDate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${+d}. ${+m}. ${y}`; };
const parseNum = v => { const n = parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const fmtNum = n => String(n ?? "").replace(".", ",");
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const KIND = { faktura: ["FV", "Faktura"], zalohova: ["ZF", "Zálohová faktura"], paragon: ["PD", "Paragon"], ddpp: ["DD", "Daňový doklad k platbě"] };
const PAY = { prevod: "Bankovním převodem", hotove: "Hotově", karta: "Platební kartou", dobirka: "Dobírkou", zapocet: "Zápočtem" };

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) {
    let msg = "Server vrátil chybu " + r.status;
    try { msg = (await r.json()).error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r;
}
const apiJson = async (m, p, b) => (await api(m, p, b)).json();
const localToday = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
async function reload() { S = await apiJson("GET", "/api/state"); S.today = localToday(); chrome(); }

// ---------- Android (aplikace ve WebView) ----------
// WebView neumí zobrazit PDF ani stahovat soubory, proto se o obojí stará nativní část aplikace.
const AND = window.Android || null;
const blobB64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = no; r.readAsDataURL(blob); });
async function pdfImages(blob) { return JSON.parse(AND.renderPdf(await blobB64(blob))); }
if (AND) document.addEventListener("click", async e => {
  const a = e.target.closest && e.target.closest('a[href^="/api/"]');
  if (!a) return;
  e.preventDefault();
  try {
    const r = await api("GET", a.getAttribute("href"));
    const name = (/filename="([^"]+)"/.exec(r.headers.get("Content-Disposition") || "") || [])[1] || "soubor";
    const mime = (r.headers.get("Content-Type") || "application/octet-stream").split(";")[0];
    const b64 = await blobB64(await r.blob());
    const msg = mime === "application/pdf" ? AND.openFile(b64, name, mime) : AND.saveFile(b64, name, mime);
    if (msg) toast(msg);
  } catch (er) { fail(er); }
});

let toastTimer;
function toast(msg, bad) {
  $$(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.setAttribute("role", "status");
  t.textContent = msg;
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), bad ? 7000 : 2600);
}
const fail = e => toast(e.message || String(e), true);

// ---------- vzhled ----------
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("#themeBtn").textContent = t === "dark" ? "Světlý režim" : "Tmavý režim";
}
function initTheme() {
  let t = null;
  const forced = new URLSearchParams(location.search).get("tema");
  if (forced) t = forced === "tmava" ? "dark" : "light";
  else try { t = localStorage.getItem("fakturace-theme"); } catch (e) {}
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(t);
  $("#themeBtn").onclick = () => {
    const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("fakturace-theme", n); } catch (e) {}
    applyTheme(n);
  };
}
function chrome() {
  $("#brandSub").textContent = S.settings.company.name || "Firma zatím není vyplněna";
  $("#railFoot").textContent = `Účetní rok ${S.settings.year} · verze ${S.version}`;
}

// ---------- směrování ----------
function route() {
  const [path, qs] = location.hash.replace(/^#\/?/, "").split("?");
  const seg = path.split("/");
  const q = new URLSearchParams(qs || "");
  const page = seg[0] || "doklady";
  $$(".rail a[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === page || (a.dataset.nav === "doklady" && page === "doklad")));
  if (page === "novy") return viewEditor(null, q);
  if (page === "doklad") return viewEditor(+seg[1], q);
  if (page === "adresar") return viewContacts();
  if (page === "sablony") return viewTemplates();
  if (page === "nastaveni") return viewSettings();
  return viewLedger();
}

// ---------- kniha dokladů ----------
function invState(i) {
  if (i.canceled) return ["void", "Stornováno"];
  if (i.paid_date) return ["paid", "Uhrazeno " + czDate(i.paid_date)];
  if (i.due_date && i.due_date < S.today) return ["late", "Po splatnosti"];
  return ["open", "Neuhrazeno"];
}
function viewLedger() {
  const years = [...new Set([S.settings.year, ...S.invoices.map(i => i.year)])].sort((a, b) => b - a);
  if (F.year === "") F.year = String(S.settings.year);
  const q = F.q.trim().toLowerCase();

function ledgerRow(i) {

      </details>
    </td></tr>`;

async function rowAction(act, id) {
  const inv = S.invoices.find(i => i.id === id);
  if (act === "paid") await api("POST", `/api/invoices/${id}/paid`, { date: S.today });
  else if (act === "unpaid") await api("POST", `/api/invoices/${id}/paid`, { date: "" });
  else if (act === "storno") { if (!confirm(`Stornovat doklad ${inv.number}? Zůstane v knize označený jako stornovaný.`)) return; await api("POST", `/api/invoices/${id}/storno`, { canceled: true }); }
  else if (act === "unstorno") await api("POST", `/api/invoices/${id}/storno`, { canceled: false });
  else if (act === "delete") { if (!confirm(`Smazat doklad ${inv.number}? Tuto akci nelze vrátit.`)) return; await api("DELETE", `/api/invoices/${id}`); }
  else if (act === "copy") { location.hash = `#/novy?kopie=${id}`; return; }
  else if (act === "tofaktura") { location.hash = `#/novy?zaloha=${id}&typ=faktura`; return; }
  else if (act === "toddpp") { location.hash = `#/novy?zaloha=${id}&typ=ddpp`; return; }
  await reload();
  viewLedger();
  toast({ paid: "Označeno jako uhrazené", unpaid: "Úhrada zrušena", storno: "Doklad stornován", unstorno: "Storno zrušeno", delete: "Doklad smazán" }[act]);
}

    <td class="x">${draft.items.length > 1 ? `<button type="button" class="rm" data-rm="${i}" aria-label="Odebrat položku ${i + 1}">×</button>` : ""}</td></tr>`).join("");
  $$("[data-rm]").forEach(b => b.onclick = () => { draft.items.splice(+b.dataset.rm, 1); renderItems(); recalc(); });
  $$("#items textarea").forEach(t => { const fit = () => { t.style.height = "37px"; t.style.height = Math.max(37, t.scrollHeight + 2) + "px"; }; t.addEventListener("input", fit); fit(); });
}
let calcT, pvT, pvUrl, lastErrors = [];
function recalc() {
  clearTimeout(calcT);
  calcT = setTimeout(async () => {
    try {
      const t = await apiJson("POST", "/api/calc", draft);
      lastErrors = t.errors;
      const rows = [];
      if (t.vat && !draft.reverse_charge) t.rates.forEach(r => { rows.push([`Základ daně ${fmtNum(r.rate)} %`, r.base]); rows.push([`DPH ${fmtNum(r.rate)} %`, r.tax]); });
      if (t.vat && draft.reverse_charge) rows.push(["Celkem bez DPH (daň odvede zákazník)", t.base]);
      if (t.deposit || t.rounding) rows.push(["Celkem", t.total]);
      if (t.deposit) rows.push(["Uhrazeno zálohou", -t.deposit]);
      if (t.rounding) rows.push(["Zaokrouhlení", t.rounding]);
      $("#totals").innerHTML = rows.map(([l, v]) => `<div><span>${l}</span><b>${money(v)}</b></div>`).join("") + `<div class="final"><span>K úhradě</span><b>${money(t.payable)}</b></div>`;
      $("#msgs").innerHTML = (t.warnings.length ? `<div class="notice warn"><ul>${t.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : "");
    } catch (e) { fail(e); }
  }, 220);
  clearTimeout(pvT);
  pvT = setTimeout(preview, 650);
}
async function preview() {
  try {
    const r = await api("POST", "/api/preview?template=" + encodeURIComponent(draft.template || ""), draft);
    const blob = await r.blob();
    if (AND) {
      const imgs = await pdfImages(blob), box = $("#pv");
      if (box) box.innerHTML = imgs.map((u, i) => `<img src="${u}" alt="Náhled dokladu, strana ${i + 1}">`).join("");
      return;
    }
    const url = URL.createObjectURL(blob);
    const f = $("#pv");
    if (!f) return;
    f.src = url + "#toolbar=0&navpanes=0&view=FitH";
    if (pvUrl) URL.revokeObjectURL(pvUrl);
    pvUrl = url;
  } catch (e) { /* náhled není kritický */ }
}
async function save() {
  const isNew = !draft.id;
  const btn = $("#save");
  btn.disabled = true;
  try {
    const wantContact = $("#saveContact").checked && $("#saveContactWrap").style.display !== "none";
    const inv = await apiJson(isNew ? "POST" : "PUT", isNew ? "/api/invoices" : `/api/invoices/${draft.id}`, draft);
    if (wantContact) await api("POST", "/api/contacts", { ...draft.customer });
    await reload();
    toast(isNew ? `Doklad ${inv.number} vystaven` : "Změny uloženy");
    if (isNew) location.hash = `#/doklad/${inv.id}`; else viewEditor(inv.id, new URLSearchParams());
  } catch (e) {
    $("#msgs").innerHTML = `<div class="notice bad">${esc(e.message)}</div>`;
    window.scrollTo({ top: 0, behavior: "smooth" });
  } finally { btn.disabled = false; }
}

// ---------- adresář ----------
function viewContacts(editId) {
  const list = [...S.contacts].sort((a, b) => a.name.localeCompare(b.name, "cs"));
  const e = editId === 0 ? { id: 0 } : S.contacts.find(c => c.id === editId);
  const fld = (k, l, cls = "s4", extra = "") => `<label class="f ${cls}"><span>${l}</span><input type="text" data-k="${k}" value="${esc(e?.[k] || "")}" ${extra}></label>`;
  $("#main").innerHTML = `
    <div class="head"><div><h1>Adresář</h1><p>Odběratelé, které vkládáte do dokladů.</p></div>
      <div class="actions"><button class="btn primary" id="addC" type="button">Nový kontakt</button></div></div>
    ${e ? `<form class="panel" id="cform" onsubmit="return false" style="margin-bottom:16px"><h2>${e.id ? "Upravit kontakt" : "Nový kontakt"}</h2><div class="grid">
      ${fld("name", "Název nebo jméno", "s8")}${fld("ico", "IČO", "s4", 'inputmode="numeric"')}
      ${fld("street", "Ulice a číslo", "s8")}${fld("dic", "DIČ")}
      ${fld("zip", "PSČ", "s3")}<label class="f" style="grid-column:span 5"><span>Město</span><input type="text" data-k="city" value="${esc(e.city || "")}"></label>${fld("country", "Stát (jen mimo ČR)")}
      ${fld("email", "E-mail")}${fld("phone", "Telefon")}${fld("note", "Poznámka")}
      </div><div class="actions" style="margin-top:16px"><button class="btn primary" id="saveC" type="button">Uložit kontakt</button><button class="btn" id="cancelC" type="button">Zrušit</button></div></form>` : ""}
    <div class="tablewrap">${list.length ? `<table class="ledger"><thead><tr><th>Název</th><th>Adresa</th><th>IČO</th><th>DIČ</th><th>Kontakt</th><th></th></tr></thead><tbody>
      ${list.map(c => `<tr><td class="no">${esc(c.name)}</td><td>${esc([c.street, [c.zip, c.city].filter(Boolean).join(" ")].filter(Boolean).join(", "))}</td><td>${esc(c.ico)}</td><td>${esc(c.dic)}</td><td>${esc([c.email, c.phone].filter(Boolean).join(", "))}</td>
      <td class="rowact"><a class="btn small" href="#/novy" data-inv="${c.id}">Vystavit doklad</a> <button class="btn small" data-edit="${c.id}" type="button">Upravit</button> <button class="btn small danger" data-del="${c.id}" type="button">Smazat</button></td></tr>`).join("")}
      </tbody></table>` : `<div class="empty"><b>Adresář je prázdný</b>Přidejte první kontakt, nebo ho uložte přímo při vystavení dokladu.</div>`}</div>`;
  $("#addC").onclick = () => viewContacts(0);
  $$("[data-edit]").forEach(b => b.onclick = () => { viewContacts(+b.dataset.edit); window.scrollTo(0, 0); });
  $$("[data-del]").forEach(b => b.onclick = async () => {
    const c = S.contacts.find(x => x.id === +b.dataset.del);
    if (!confirm(`Smazat kontakt ${c.name}? Vystavené doklady zůstanou beze změny.`)) return;
    try { await api("DELETE", `/api/contacts/${c.id}`); await reload(); viewContacts(); toast("Kontakt smazán"); } catch (er) { fail(er); }
  });
  $$("[data-inv]").forEach(a => a.onclick = ev => { ev.preventDefault(); location.hash = "#/novy"; setTimeout(() => { const p = $("#pick"); if (p) { p.value = a.dataset.inv; p.dispatchEvent(new Event("change")); } }, 30); });
  if (e) {
    $("#cancelC").onclick = () => viewContacts();
    $("#saveC").onclick = async () => {
      const c = { id: e.id }; $$("#cform [data-k]").forEach(i => c[i.dataset.k] = i.value.trim());
      try { await api(e.id ? "PUT" : "POST", e.id ? `/api/contacts/${e.id}` : "/api/contacts", c); await reload(); viewContacts(); toast("Kontakt uložen"); } catch (er) { fail(er); }
    };
    $('#cform [data-k="name"]').focus();
  }
}

// ---------- šablony ----------
function viewTemplates() {
  const s = S.settings;
  const presets = ["#3d6df2", "#0f766e", "#b4232a", "#7c3aed", "#c2410c", "#1f2937"];
  const acc = s.accent.replace("#", "");
  $("#main").innerHTML = `
    <div class="head"><div><h1>Šablony dokladů</h1><p>Výchozí vzhled PDF. U každého dokladu můžete šablonu změnit v náhledu.</p></div></div>
    <div class="panel" style="margin-bottom:18px"><h2>Barva firmy</h2>
      <div class="swatches">${presets.map(p => `<button type="button" data-acc="${p}" class="${p === s.accent ? "on" : ""}" style="background:${p}" aria-label="Barva ${p}"></button>`).join("")}
      <input type="color" id="accPick" value="${esc(s.accent)}" aria-label="Vlastní barva"><span class="hint" style="margin:0">Linka, zvýraznění a barevné plochy v šablonách.</span></div>
    </div>
    <div class="tpls">${S.templates.map(t => `<button type="button" class="tpl ${t.id === s.template ? "on" : ""}" data-set="${t.id}">
      <div class="shot" data-shot="${t.id}">${AND ? "" : `<iframe src="/api/sample?template=${t.id}&accent=${acc}#toolbar=0&navpanes=0&scrollbar=0&view=Fit" title="Ukázka šablony ${esc(t.name)}" tabindex="-1" loading="lazy"></iframe>`}</div>
      <div class="cap"><b>${esc(t.name)}</b><span>${esc(t.desc)}</span></div></button>`).join("")}</div>
    <p class="hint" style="margin-top:16px">Ukázky používají vaše firemní údaje, logo a razítko z Nastavení. <a href="/api/sample?template=${s.template}" target="_blank" rel="noopener">Otevřít ukázku v plné velikosti</a></p>`;
  if (AND) $$("[data-shot]").forEach(async box => {
    try {
      const r = await api("GET", `/api/sample?template=${box.dataset.shot}&accent=${acc}`);
      const imgs = await pdfImages(await r.blob());
      box.innerHTML = `<img src="${imgs[0]}" alt="Ukázka šablony">`;
    } catch (e) {}
  });
  const put = async patch => { try { await api("PUT", "/api/settings", { ...S.settings, ...patch }); await reload(); viewTemplates(); toast("Uloženo"); } catch (e) { fail(e); } };
  $$("[data-set]").forEach(b => b.onclick = () => put({ template: b.dataset.set }));
  $$("[data-acc]").forEach(b => b.onclick = () => put({ accent: b.dataset.acc }));
  $("#accPick").onchange = e => put({ accent: e.target.value });
}

// ---------- nastavení ----------
function viewSettings() {
  const s = JSON.parse(JSON.stringify(S.settings)), c = s.company;
  const fld = (k, l, cls = "s4", ph = "") => `<label class="f ${cls}"><span>${l}</span><input type="text" data-co="${k}" value="${esc(c[k] || "")}" placeholder="${esc(ph)}"></label>`;
  const img = (k, l, hint) => `<div class="f s6"><span>${l}</span><div class="imgbox"><div class="thumb">${s[k] ? `<img src="${s[k]}" alt="">` : "žádný obrázek"}</div>
    <div><label class="btn small">Nahrát PNG nebo JPEG<input type="file" accept="image/png,image/jpeg" data-img="${k}" hidden></label> ${s[k] ? `<button type="button" class="btn small danger" data-rmimg="${k}">Odebrat</button>` : ""}<div class="hint" style="margin:6px 0 0">${hint}</div></div></div></div>`;
  $("#main").innerHTML = `
    <div class="head"><div><h1>Nastavení</h1><p>Údaje vaší firmy se propíší do každého nově vystaveného dokladu.</p></div>
      <div class="actions"><button class="btn primary" id="saveS" type="button">Uložit nastavení</button></div></div>
    <div class="panel"><h2>Firma</h2><div class="grid">
      ${fld("name", "Název firmy nebo jméno a příjmení", "s8")}${fld("ico", "IČO")}
      ${fld("street", "Ulice a číslo", "s8")}${fld("dic", "DIČ", "s4", "CZ12345678")}
      ${fld("zip", "PSČ", "s3")}<label class="f" style="grid-column:span 5"><span>Město</span><input type="text" data-co="city" value="${esc(c.city)}"></label>${fld("country", "Stát")}
      <label class="check"><input type="checkbox" id="vatPayer" ${c.vat_payer ? "checked" : ""}><span>Jsem plátce DPH<small>Plátce vystavuje daňové doklady s rozpisem DPH. Neplátce má na dokladu „Nejsem plátce DPH“ a žádnou daň.</small></span></label>
      ${fld("register", "Zápis v rejstříku (povinný údaj na dokladech)", "s12", "Společnost je zapsána v obchodním rejstříku vedeném Městským soudem v Praze, oddíl C, vložka …")}
      ${fld("phone", "Telefon")}${fld("email", "E-mail")}${fld("web", "Web")}
      ${fld("issued_by", "Doklady vystavuje", "s4", "jméno a příjmení")}
    </div></div>
    <div class="panel"><h2>Bankovní účet</h2><p class="hint">Z českého čísla účtu se IBAN dopočítá sám. IBAN je potřeba pro QR Platbu a export ISDOC.</p><div class="grid">
      ${fld("bank_account", "Číslo účtu", "s4", "123456789/0100")}${fld("iban", "IBAN", "s4", "dopočítá se")}${fld("swift", "BIC / SWIFT", "s2")}${fld("bank_name", "Banka", "s2")}
    </div></div>
    <div class="panel"><h2>Logo a razítko</h2><div class="grid">
      ${img("logo", "Logo", "Zobrazí se v záhlaví dokladu. Nejlépe PNG s průhledným pozadím.")}
      ${img("stamp", "Razítko a podpis", "Vloží se do pole pro podpis.")}
    </div></div>
    <div class="panel"><h2>Výchozí hodnoty dokladů</h2><div class="grid">
      <label class="f s3"><span>Splatnost (dnů)</span><input type="number" min="0" max="365" id="dueDays" value="${s.due_days}"></label>
      <label class="f s3"><span>Výchozí sazba DPH (%)</span><select id="defVat">${[21, 12, 0].map(r => `<option ${r === s.default_vat ? "selected" : ""}>${r}</option>`).join("")}</select></label>
      <label class="f s4"><span>Výchozí forma úhrady</span><select id="defPay">${Object.entries(PAY).map(([p, l]) => `<option value="${p}" ${s.default_payment === p ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="check"><input type="checkbox" id="roundCash" ${s.round_cash ? "checked" : ""}><span>Hotovostní platby zaokrouhlovat na celé koruny<small>Zaokrouhlovací rozdíl se nezapočítává do základu daně.</small></span></label>
      <label class="check"><input type="checkbox" id="showQr" ${s.show_qr ? "checked" : ""}><span>Tisknout QR Platbu na doklady placené převodem</span></label>
      <label class="f s12"><span>Text v patičce dokladů</span><input type="text" id="footNote" value="${esc(s.footer_note)}"></label>
    </div></div>
    <div class="panel"><h2>Číselné řady a účetní rok</h2>
      <p class="hint">Aktivní rok je <b>${s.year}</b>. V masce použijte {RRRR} nebo {RR} pro rok a {NNNN} pro pořadové číslo – počet N určuje počet číslic. Řada musí být souvislá, bez mezer.</p>
      <div class="series"><div class="h">Typ dokladu</div><div class="h">Maska čísla</div><div class="h">Další pořadí</div><div class="h">Další doklad dostane</div>
      ${Object.entries(KIND).map(([k, v]) => `<div>${v[1]}</div><input type="text" data-sp="${k}" value="${esc(s.series[k].pattern)}" aria-label="Maska – ${v[1]}"><input type="number" min="1" data-sn="${k}" value="${s.series[k].next}" aria-label="Další pořadí – ${v[1]}"><code data-prev="${k}">${esc(S.next_numbers[k])}</code>`).join("")}</div>
      <div class="grid" style="margin-top:20px;align-items:end">
        <label class="f s3"><span>Zahájit číslování pro rok</span><input type="number" id="newYear" min="2000" max="2200" value="${Math.max(s.year + 1, +S.today.slice(0, 4))}"></label>
        <div class="f s8"><div><button class="btn" id="startYear" type="button">Zahájit nový rok</button></div></div>
      </div>
      <p class="hint" style="margin:10px 0 0">Nový rok nastaví všechny řady znovu od čísla 1. Doklady z minulých let zůstávají v knize.</p>
    </div>
    <div class="panel"><h2>Záloha dat</h2><p class="hint">Všechna data jsou v jednom souboru v tomto zařízení. Zálohu si stahujte pravidelně – doklady je nutné archivovat 10 let.</p>
      <div class="actions"><a class="btn" href="/api/backup">Stáhnout zálohu</a><label class="btn">Obnovit ze zálohy<input type="file" accept="application/json,.json" id="restore" hidden></label></div></div>`;
  const pv = () => $$("[data-sp]").forEach(i => {
    const k = i.dataset.sp, n = +$(`[data-sn="${k}"]`).value || 1;
    $(`[data-prev="${k}"]`).textContent = i.value.replace(/\{(RRRR|RR|N+)\}/g, (m, t) => t === "RRRR" ? s.year : t === "RR" ? String(s.year).slice(2) : String(n).padStart(t.length, "0"));
  });
  $$("[data-sp],[data-sn]").forEach(i => i.oninput = pv);
  const collect = () => {
    $$("[data-co]").forEach(i => c[i.dataset.co] = i.value.trim());
    c.vat_payer = $("#vatPayer").checked;
    s.due_days = +$("#dueDays").value || 0; s.default_vat = +$("#defVat").value; s.default_payment = $("#defPay").value;
    s.round_cash = $("#roundCash").checked; s.show_qr = $("#showQr").checked; s.footer_note = $("#footNote").value.trim();
    $$("[data-sp]").forEach(i => s.series[i.dataset.sp].pattern = i.value.trim());
    $$("[data-sn]").forEach(i => s.series[i.dataset.sn].next = +i.value || 1);
    return s;
  };
  const saveS = async msg => { try { await api("PUT", "/api/settings", collect()); await reload(); viewSettings(); toast(msg || "Nastavení uloženo"); } catch (e) { fail(e); } };
  $("#saveS").onclick = () => saveS();
  $$("[data-img]").forEach(i => i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    if (f.size > 4 * 1024 * 1024) return toast("Obrázek je větší než 4 MB. Zmenšete ho prosím.", true);
    const r = new FileReader();
    r.onload = () => { collect(); s[i.dataset.img] = r.result; saveS("Obrázek uložen"); };
    r.readAsDataURL(f);
  });
  $$("[data-rmimg]").forEach(b => b.onclick = () => { collect(); s[b.dataset.rmimg] = ""; saveS("Obrázek odebrán"); });
  $("#startYear").onclick = async () => {
    const y = +$("#newYear").value;
    if (!confirm(`Zahájit číslování pro rok ${y}? Všechny číselné řady začnou znovu od 1.`)) return;
    try { await api("PUT", "/api/settings", collect()); await api("POST", "/api/year", { year: y }); await reload(); F.year = String(y); viewSettings(); toast(`Aktivní rok je ${y}`); } catch (e) { fail(e); }
  };
  $("#restore").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!confirm("Obnovit data ze zálohy? Současná data budou nahrazena.")) return;
    try { await api("POST", "/api/restore", JSON.parse(await f.text())); await reload(); viewSettings(); toast("Data obnovena ze zálohy"); } catch (er) { fail(er); }
  };
}

document.addEventListener("click", e => { $$("details.more[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; }); });
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); route(); });
initTheme();
reload().then(route).catch(e => { $("#main").innerHTML = `<div class="notice bad">Aplikaci se nepodařilo načíst: ${esc(e.message)}</div>`; });
</script>
