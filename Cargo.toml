[package]
name = "fakturace"
version = "1.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
android = ["dep:jni"]

[dependencies]
jni = { version = "0.21", optional = true, default-features = false }
base64 = "0.23.1"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = "0.9.1"
pdf-writer = "0.15.0"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subsetter = "0.2.6"
tiny_http = "0.12.0"
ttf-parser = "0.25.1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "unwind"
